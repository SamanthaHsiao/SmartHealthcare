<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ink:#1d2b29;--brand:#1f8a70;--gold:#f0a924;--soft:#eef5f2}
*{margin:0;padding:0;box-sizing:border-box}

.blob{position:absolute;border-radius:50%}
#b1{width:900px;height:900px;left:-260px;top:420px;background:var(--brand);opacity:.10}
#b2{width:520px;height:520px;left:960px;top:-220px;background:var(--gold);opacity:.16}
.t{position:absolute;left:150px;opacity:0}
.kick{display:inline-block;font-weight:700;font-size:30px;letter-spacing:.08em;padding:10px 24px;border-radius:999px;background:var(--brand);color:#fff}
.h{font-weight:700;font-size:68px;line-height:1.0;color:var(--ink);letter-spacing:-.015em;white-space:nowrap}
.h em{font-style:normal;background:linear-gradient(transparent 58%,rgba(240,169,36,.55) 58%)}
#card{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#fff}
#band{position:absolute;left:0;top:820px;width:1920px;height:260px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.75) 45%)}
#card svg{display:block}
</style></head><body>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div>
<div id="card"><svg id="sv" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div><div id="band"></div><div class="t" id="k" style="top:872px;left:120px"><span class="kick" id="kt"></span></div><div class="t h" id="l0" style="top:942px;left:120px;font-size:64px"></div><div class="t" id="l1" style="top:1020px;left:120px;font-family:Poppins;font-weight:600;font-size:36px;color:#1f8a70;white-space:nowrap"></div><div class="t h" id="l2" style="display:none"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
const ease=x=>{x=cl(x);return x*x*(3-2*x)};
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const C={ink:'#1d2b29',brand:'#1f8a70',gold:'#f0a924',warn:'#e5564f',purple:'#9b7fe6',green:'#3fae6a',soft:'#eef5f2',white:'#ffffff'};
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const m=v=>Math.round(f<0?v*(1+f):v+(255-v)*f);return '#'+[m(r),m(g),m(b)].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('')}
let DEFS=new Map();
function lg(c,dir='h'){const id='g'+dir+c.slice(1);if(!DEFS.has(id)){
  const [x2,y2]=dir==='h'?['1','0']:['0','1'];
  DEFS.set(id,`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${shade(c,.12)}"/><stop offset="1" stop-color="${shade(c,-.12)}"/></linearGradient>`)}
  return `url(#${id})`}
const ctx=document.createElement('canvas').getContext('2d');
function tw(s,size,w=700){ctx.font=`${w} ${size}px Poppins`;return ctx.measureText(s).width}
// ---------------- character ----------------
const SKINS=['#f2c9a0','#e0ac7e','#c98d5f','#f5d3b3'];
function person(o){
  const {x,fy,shirt='#f0a924',pants='#34434a',hair='#4a3426',skin='#f2c9a0',style='short',walk=0,phase=0,
    coat=false,mood='happy',elder=false,op=1,phone=false,legs=true,bandage=false,sling=false,closed=false,pain=false,tp=0,nod=0,point=null,joy=false,cheer=false,look=0,phoneFront=false,wave=false,stop=-1}=o;
  const seed=[...(shirt+hair+skin+style)].reduce((a,c)=>a+c.charCodeAt(0),0)%97/97*3.2; const blink=!closed&&!pain&&((NOW+seed)%3.2)<0.13;
  // walk cycle: legs swing from the hip, body rises at the passing pose and dips on contact,
  // weight shifts over the stance leg, arms swing opposite to the legs
  const sw=Math.sin(phase)*walk, cs=Math.cos(phase);
  const bob=(1-Math.abs(Math.sin(phase)))*9*walk - Math.abs(Math.sin(phase))*2*walk;
  const L=Math.max(0,cs)*16*walk, R=Math.max(0,-cs)*16*walk;   // lift the leg that is swinging forward
  const shift=-sw*5, tilt=-sw*2.2;                              // weight over the stance leg
  let st=0, stArm=0;                                            // settle after stopping
  if(stop>=0&&stop<0.6){const u=stop/0.6; st=Math.sin(u*Math.PI)*7*(1-u); stArm=Math.sin(stop*16)*9*(1-u);}
  let s=`<g opacity="${op}"><ellipse cx="${x}" cy="${fy+2}" rx="${78-bob*1.2}" ry="13" fill="#1d2b29" opacity=".10"/>`;
  s+=`<g transform="translate(${x+shift},${fy-bob+st}) rotate(${tilt} 0 -150)">`;
  // long hair back layer
  if(style==='long') s+=`<path d="M-46 -350 Q-50 -270 -40 -250 L40 -250 Q50 -270 46 -350 Z" fill="${shade(hair,-.08)}"/>`;
  // legs
  const leg=(cx,lift,ang)=>`<g transform="rotate(${ang} ${cx} -156)"><rect x="${cx-14}" y="-156" width="28" height="${142-lift}" rx="14" fill="${lg(pants)}"/>
    <ellipse cx="${cx+(cx<0?-4:4)}" cy="${-14-lift}" rx="21" ry="11" fill="#263238" transform="rotate(${-ang*0.6} ${cx} ${-14-lift})"/></g>`;
  if(legs) s+=leg(-19,L,sw*9)+leg(19,R,-sw*9);
  // arms
  const armC=coat?'#ffffff':shirt, a1=10-sw*26+stArm, a2=-10-sw*26-stArm;
  const arm=(sx,ang,front)=>`<g transform="translate(${sx},-272) rotate(${ang})"><rect x="-13" y="-6" width="26" height="122" rx="13" fill="${front?lg(armC):shade(armC,-.1)}"/><circle cx="0" cy="120" r="13" fill="${skin}"/></g>`;
  if(phone){ s+=arm(-56,a1,true); s+=`<g transform="translate(56,-272) rotate(-150)"><rect x="-13" y="-6" width="26" height="100" rx="13" fill="${lg(armC)}"/><circle cx="0" cy="98" r="13" fill="${skin}"/></g><rect x="78" y="-370" width="20" height="38" rx="5" fill="#263238"/>`; }
  else if(cheer){const w=Math.sin(NOW*9)*10; s+=arm(-56,155+w,true)+arm(56,-155-w,true);}
  else if(wave){s+=arm(-56,a1,true)+arm(56,-150+Math.sin(NOW*10)*18,true);}
  else s+=arm(-56,point==='left'?100:a1,true)+((pain||phoneFront)?'':arm(56,point==='right'?-100:a2,true));
  // torso
  const torso=`M-52 -272 Q-58 -290 -36 -292 L36 -292 Q58 -290 52 -272 L48 -156 Q48 -144 36 -144 L-36 -144 Q-48 -144 -48 -156 Z`;
  s+=`<path d="${torso}" fill="${lg(coat?C.brand:shirt)}"/>`;
  if(coat){
    s+=`<path d="M-58 -284 L-14 -292 L-8 -200 L-12 -132 L-54 -132 L-50 -230 Z" fill="${lg('#ffffff')}"/>`;
    s+=`<path d="M58 -284 L14 -292 L8 -200 L12 -132 L54 -132 L50 -230 Z" fill="#e6ecea"/>`;
    s+=`<path d="M-14 -292 L0 -262 L14 -292" fill="none" stroke="#d4dcda" stroke-width="3"/>`;
    s+=`<path d="M-18 -290 C-30 -236 30 -236 18 -290" fill="none" stroke="#37474f" stroke-width="5" stroke-linecap="round"/><circle cx="20" cy="-243" r="8" fill="#b0bec5" stroke="#37474f" stroke-width="3"/>`;
    s+=`<rect x="-46" y="-252" width="24" height="30" rx="4" fill="${C.brand}"/><rect x="-42" y="-244" width="16" height="4" rx="2" fill="#fff"/>`;
  } else {
    s+=`<path d="M-16 -292 Q0 -276 16 -292" fill="${shade(shirt,-.18)}"/>`;
  }
  // neck + head
  s+=`<rect x="-11" y="-308" width="22" height="22" rx="6" fill="${shade(skin,-.08)}"/>`;
  s+=`<g transform="rotate(${nod-tilt*0.6+Math.sin(phase*2)*1.2*walk} 0 -298)">`;
  s+=`<ellipse cx="-40" cy="-332" rx="7" ry="10" fill="${shade(skin,-.05)}"/><ellipse cx="40" cy="-332" rx="7" ry="10" fill="${shade(skin,-.05)}"/>`;
  s+=`<ellipse cx="0" cy="-336" rx="40" ry="44" fill="${skin}"/>`;
  s+=`<path d="M10 -378 Q38 -360 38 -330 Q36 -300 12 -293 Q30 -320 10 -378 Z" fill="${shade(skin,-.06)}" opacity=".6"/>`;
  // hair
  const cap=`M-43 -334 C-48 -398 48 -398 43 -334 C38 -360 18 -372 -6 -366 C-22 -362 -36 -352 -43 -334 Z`;
  if(elder){ s+=`<path d="M-42 -336 C-46 -360 -36 -374 -24 -378 C-30 -366 -34 -352 -36 -336 Z M42 -336 C46 -360 36 -374 24 -378 C30 -366 34 -352 36 -336 Z" fill="${hair}"/><path d="M-26 -376 Q0 -388 26 -376" fill="none" stroke="${hair}" stroke-width="6" stroke-linecap="round"/>`; }
  else {
    s+=`<path d="${cap}" fill="${hair}"/>`;
    if(style==='bun') s+=`<circle cx="0" cy="-386" r="18" fill="${hair}"/>`;
    if(style==='bob'||style==='long') s+=`<path d="M-43 -340 Q-50 -300 -40 -292 L-34 -296 Q-40 -320 -38 -340 Z M43 -340 Q50 -300 40 -292 L34 -296 Q40 -320 38 -340 Z" fill="${hair}"/>`;
  }
  if(coat) s+=`<path d="M-26 -384 Q0 -404 26 -384 L22 -372 Q0 -384 -22 -372 Z" fill="#fff"/><rect x="-5" y="-392" width="10" height="10" rx="2" fill="${C.warn}" opacity=".85"/>`;
  // face
  const eye=ex=>`<ellipse cx="${ex}" cy="${-334+look*3}" rx="4.6" ry="6" fill="#263238"/><circle cx="${ex+1.6}" cy="${-336.5+look*3}" r="1.6" fill="#fff"/>`;
  s+=pain?`<path d="M-22 -339 L-10 -334 L-22 -329 M22 -339 L10 -334 L22 -329" fill="none" stroke="#263238" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`:closed?`<path d="M-20 -334 Q-14 -328 -8 -334 M8 -334 Q14 -328 20 -334" fill="none" stroke="#263238" stroke-width="3.5" stroke-linecap="round"/>`:blink?`<path d="M-20 -334 L-8 -334 M8 -334 L20 -334" stroke="#263238" stroke-width="3.5" stroke-linecap="round"/>`:eye(-14)+eye(14);
  if(pain) s+=`<path d="M-26 -343 L-8 -354 M26 -343 L8 -354" stroke="${shade(hair,-.25)}" stroke-width="4.5" stroke-linecap="round"/><rect x="-12" y="-320" width="24" height="12" rx="5" fill="#8d4a3a"/><path d="M-10 -314 L10 -314" stroke="#fff" stroke-width="2.5"/>`;
  else if(joy) s+=`<path d="M-24 -352 Q-15 -358 -6 -352 M24 -352 Q15 -358 6 -352" fill="none" stroke="${shade(hair,-.1)}" stroke-width="3.5" stroke-linecap="round"/><path d="M-14 -318 Q0 -296 14 -318 Z" fill="#8d4a3a"/><path d="M-9 -316 Q0 -310 9 -316" fill="none" stroke="#fff" stroke-width="3"/>`;
  else if(mood==='worried') s+=`<path d="M-24 -345 L-8 -352 M24 -345 L8 -352" stroke="${shade(hair,-.1)}" stroke-width="4" stroke-linecap="round"/><path d="M-8 -312 Q0 -318 8 -312" fill="none" stroke="#8d4a3a" stroke-width="3.5" stroke-linecap="round"/>`;
  else s+=`<path d="M-23 -349 Q-15 -353 -7 -349 M23 -349 Q15 -353 7 -349" fill="none" stroke="${shade(hair,-.1)}" stroke-width="3.5" stroke-linecap="round"/><path d="M-11 -315 Q0 -305 11 -315" fill="none" stroke="#8d4a3a" stroke-width="3.5" stroke-linecap="round"/>`;
  s+=`<circle cx="-24" cy="-320" r="7" fill="#f29a9a" opacity=".45"/><circle cx="24" cy="-320" r="7" fill="#f29a9a" opacity=".45"/>`;
  if(bandage) s+=`<path d="M-43 -366 Q0 -384 43 -366 L44 -346 Q0 -364 -44 -346 Z" fill="#ffffff" stroke="#dfe6e4" stroke-width="2"/><circle cx="16" cy="-363" r="6" fill="#e5564f"/>`;
  if(elder) s+=`<circle cx="-14" cy="-334" r="11" fill="none" stroke="#546e7a" stroke-width="3"/><circle cx="14" cy="-334" r="11" fill="none" stroke="#546e7a" stroke-width="3"/><path d="M-3 -334 L3 -334" stroke="#546e7a" stroke-width="3"/>`;
  s+=`</g>`;
  if(sling) s+=`<rect x="-40" y="-222" width="76" height="28" rx="14" fill="${shade(shirt,-.1)}"/><circle cx="-38" cy="-208" r="13" fill="${skin}"/><path d="M-50 -292 L46 -196 L-46 -178 Z" fill="#ffffff"/><path d="M-50 -292 L46 -196 L-46 -178 Z M-50 -292 L-4 -188" fill="none" stroke="#dfe6e4" stroke-width="3"/>`;
  if(phoneFront){
    s+=`<path d="M56 -272 L60 -212 L16 -232" fill="none" stroke="${shade(shirt,-.1)}" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>`;
    s+=`<rect x="-6" y="-272" width="30" height="50" rx="7" fill="#263238"/><rect x="-2" y="-267" width="22" height="38" rx="4" fill="#9fd3e8"/><circle cx="12" cy="-234" r="13" fill="${skin}"/>`;
  }
  if(pain){
    s+=`<path d="M56 -272 L58 -220 L4 -244" fill="none" stroke="${shade(shirt,-.1)}" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-246" r="14" fill="${skin}"/>`;
    const pa=.45+.55*Math.abs(Math.sin(tp*7));
    s+=`<g opacity="${pa}"><path d="M-30 -268 L-46 -282 M-34 -248 L-56 -250 M-30 -228 L-46 -216" stroke="#e5564f" stroke-width="5" stroke-linecap="round"/></g>`;
    const d1=(tp*40)%22, d2=((tp*40)+11)%22;
    s+=`<path d="M46 ${-372+d1} q7 11 0 18 q-7 -7 0 -18 Z" fill="#7fc8f8" opacity="${1-d1/22}"/><path d="M-50 ${-360+d2} q6 10 0 16 q-6 -6 0 -16 Z" fill="#7fc8f8" opacity="${1-d2/22}"/>`;
  }
  s+=`</g></g>`;
  return s;
}
let NOW=0;
const nurse=(x=930,o={})=>person(Object.assign({x:x,fy:760,coat:true,style:'bun',hair:'#3b2a20',pants:'#17695a',skin:'#e8b88f'},o));
// ---------------- props ----------------
function bubble(x,y,lines,w,es=[]){const h=lines.length*58+40+(es.length?es.length*42+6:0);
  let s=`<g filter="url(#sh)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="30" fill="#fff"/><path d="M${x+46} ${y+h-2} L${x+34} ${y+h+34} L${x+96} ${y+h-2} Z" fill="#fff"/></g>`;
  lines.forEach((l,i)=>s+=`<text x="${x+30}" y="${y+58+i*58}" font-family="Poppins" font-weight="500" font-size="44" fill="${C.ink}">${l}</text>`);
  es.forEach((l,i)=>s+=`<text x="${x+30}" y="${y+58+(lines.length-1)*58+50+i*42}" font-family="Poppins" font-weight="500" font-size="32" fill="${C.brand}">${l}</text>`);return s}
function tagH(size,es){return size+30+(es?Math.round(size*0.6)+6:0)}
function tag(x,y,txt,col,size=42,anchor='start',es=''){const ez=Math.round(size*0.6); const w=Math.max(tw(txt,size),es?tw(es,ez,600):0)+56, h=tagH(size,es); const x0=anchor==='middle'?x-w/2:x;
  const tc=['#f0a924','#ffd166'].includes(col)?C.ink:'#fff';
  return `<g filter="url(#sh)"><rect x="${x0}" y="${y}" width="${w}" height="${h}" rx="${Math.min(h/2,34)}" fill="${col}"/></g><text x="${x0+28}" y="${y+size*0.98+8}" font-family="Poppins" font-weight="700" font-size="${size}" fill="${tc}">${txt}</text>`+
   (es?`<text x="${x0+28}" y="${y+size*0.98+8+ez+8}" font-family="Poppins" font-weight="600" font-size="${ez}" fill="${tc}" opacity=".88">${es}</text>`:'')}
function pop(t0,t){return back((t-t0)/0.35)}
function scaleAt(s,cx,cy,k){return `<g transform="translate(${cx},${cy}) scale(${k}) translate(${-cx},${-cy})">${s}</g>`}
const DOORS=[[1150,'Medicina',C.brand,'🩺'],[1390,'Pediatría',C.gold,'🧸'],[1630,'Odontología',C.purple,'🦷']];
function seated(x,o,t,ph){
  const br=Math.sin(t*2+ph)*2; const k=0.82;
  let g=`<rect x="${x-60}" y="470" width="120" height="180" rx="22" fill="${o.chair}"/><rect x="${x-50}" y="482" width="100" height="150" rx="16" fill="${shade(o.chair,.12)}"/>`;
  g+=`<g transform="translate(0,${br})">`+person({x:x,fy:784,shirt:o.shirt,hair:o.hair,style:o.style||'short',elder:o.elder,skin:o.skin,legs:false,mood:o.mood||'happy',pants:o.pants||'#34434a'})+`</g>`;
  g+=`<rect x="${x-70}" y="628" width="140" height="30" rx="12" fill="${shade(o.chair,-.15)}"/>`;
  g+=`<rect x="${x-46}" y="622" width="92" height="34" rx="16" fill="${o.pants||'#34434a'}"/>`;
  g+=`<rect x="${x-36}" y="650" width="26" height="80" rx="13" fill="${o.pants||'#34434a'}"/><rect x="${x+10}" y="650" width="26" height="80" rx="13" fill="${o.pants||'#34434a'}"/>`;
  g+=`<ellipse cx="${x-25}" cy="732" rx="20" ry="10" fill="#263238"/><ellipse cx="${x+25}" cy="732" rx="20" ry="10" fill="#263238"/>`;
  g+=`<line x1="${x-58}" y1="656" x2="${x-58}" y2="740" stroke="#90a4ae" stroke-width="6"/><line x1="${x+58}" y1="656" x2="${x+58}" y2="740" stroke="#90a4ae" stroke-width="6"/>`;
  if(o.item==='mag'){const fl=Math.sin(t*1.2+ph)>0.6?6:0; g+=`<g transform="translate(0,${br})"><rect x="${x-46}" y="${576-fl}" width="92" height="64" rx="6" fill="#ff8a65"/><rect x="${x-40}" y="${582-fl}" width="38" height="52" rx="3" fill="#fff" opacity=".8"/><rect x="${x+2}" y="${582-fl}" width="38" height="52" rx="3" fill="#fff" opacity=".6"/></g>`}
  if(o.item==='phone') g+=`<g transform="translate(0,${br})"><rect x="${x-14}" y="582" width="28" height="46" rx="6" fill="#263238"/><rect x="${x-10}" y="586" width="20" height="36" rx="3" fill="${Math.sin(t*4+ph)>0?'#9fd3e8':'#bfe6f3'}"/></g>`;
  if(o.item==='cane') g+=`<path d="M${x+78} 740 L${x+78} 590 Q${x+78} 572 ${x+62} 572" fill="none" stroke="#8d6e63" stroke-width="8" stroke-linecap="round"/>`;
  return `<g transform="translate(${x},742) scale(${k}) translate(${-x},-742)">${g}</g>`;
}
function waiting(t){
  let s=`<rect x="60" y="392" width="420" height="30" rx="15" fill="#d7e6e1"/><text x="270" y="413" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="18" fill="#6b7d79" letter-spacing="3">SALA DE ESPERA</text>`;
  s+=seated(130,{chair:'#7fb3d5',shirt:'#ff8a65',hair:'#5a3d2b',style:'bob',skin:'#f5d3b3',item:'mag'},t,0);
  s+=seated(270,{chair:'#7fb3d5',shirt:'#9575cd',hair:'#2b211c',style:'short',skin:'#c98d5f',item:'phone'},t,1.7);
  s+=seated(410,{chair:'#7fb3d5',shirt:'#4db6ac',hair:'#cfd8dc',elder:true,skin:'#f2c9a0',item:'cane',mood:'happy'},t,3.1);
  return s;
}

// SAR (Servicio de Atención Primaria de Urgencia) emergency entrance, used by the START scene
function sarRoom(t){
  let s=`<rect x="0" y="0" width="1920" height="1080" fill="url(#wall)"/>`;
  s+=`<rect x="0" y="560" width="1920" height="200" fill="#e2eeea"/><rect x="0" y="556" width="1920" height="8" fill="#d2e2dc"/>`;
  s+=`<rect x="0" y="236" width="1920" height="14" fill="#e5564f" opacity=".85"/><rect x="0" y="254" width="1920" height="4" fill="#e5564f" opacity=".5"/>`;
  for(const lx of [520,1300]) s+=`<line x1="${lx}" y1="10" x2="${lx}" y2="40" stroke="#9fb3ad" stroke-width="3"/><path d="M${lx-46} 70 Q${lx} 28 ${lx+46} 70 Z" fill="#ffffff"/><ellipse cx="${lx}" cy="72" rx="46" ry="8" fill="#fff4d6"/>`;
  s+=`<rect x="0" y="760" width="1920" height="320" fill="url(#floor)"/>`;
  for(let x=-200;x<2100;x+=220) s+=`<line x1="${x}" y1="760" x2="${x-410}" y2="1080" stroke="#c9d8d3" stroke-width="2"/>`;
  // triage guide lines on the floor
  [['#e5564f',800],['#f0a924',824],['#3fae6a',848]].forEach(([c,y])=>{s+=`<path d="M0 ${y} L1560 ${y} Q1590 ${y} 1600 ${y-20} L1610 772" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" opacity=".75"/>`;});
  // SAR sign
  s+=`<g filter="url(#sh)"><rect x="1240" y="282" width="600" height="96" rx="16" fill="#ffffff"/></g><rect x="1240" y="282" width="110" height="96" rx="16" fill="#e5564f"/><rect x="1300" y="282" width="50" height="96" fill="#e5564f"/>`;
  s+=`<rect x="1283" y="306" width="24" height="48" rx="4" fill="#fff"/><rect x="1271" y="318" width="48" height="24" rx="4" fill="#fff"/>`;
  s+=`<text x="1378" y="334" font-family="Poppins" font-weight="800" font-size="44" fill="#e5564f">SAR</text><text x="1482" y="334" font-family="Poppins" font-weight="700" font-size="40" fill="#1d2b29">Urgencia 24 h</text>`;
  s+=`<text x="1378" y="364" font-family="Poppins" font-weight="600" font-size="19" fill="#6b7d79">Servicio de Atención Primaria de Urgencia</text>`;
  // automatic sliding glass doors
